<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - ページが見つかりません</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-details {
            background: #f8f9fa;
            border-left: 4px solid #e74c3c;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
            border-radius: 8px;
        }

        .error-details h3 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .error-details p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .error-details code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #e74c3c;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #d5dbdb;
        }

        .search-box {
            margin: 30px 0;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .suggestions {
            margin-top: 30px;
            text-align: left;
        }

        .suggestions h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            margin-bottom: 10px;
        }

        .suggestions a {
            color: #667eea;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .suggestions a:hover {
            background: #f8f9fa;
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 40px 20px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 24px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">ページが見つかりません</h1>
    <p class="error-message" th:text="${errorMessage} ?: 'お探しのページは見つかりませんでした。'">
        お探しのページは見つかりませんでした。
    </p>

    <!-- エラー詳細（開発環境のみ） -->
    <div class="error-details" th:if="${requestUrl}">
        <h3>📍 リクエスト情報</h3>
        <p>
            アクセスしようとしたURL: <code th:text="${requestUrl}"></code>
        </p>
        <p style="margin-top: 10px; font-size: 13px; color: #888;">
            このページは削除されたか、URLが変更された可能性があります。
        </p>
    </div>

    <!-- 検索ボックス -->
    <div class="search-box">
        <input type="text"
               id="searchInput"
               placeholder="都道府県名で検索..."
               onkeyup="searchPrefecture(event)">
    </div>

    <!-- おすすめリンク -->
    <div class="suggestions">
        <h3>よく見られているページ</h3>
        <ul>
            <li>
                <a href="/">
                    🏠 トップページ
                </a>
            </li>
            <li>
                <a href="/weather/13">
                    🌤️ 東京都の天気
                </a>
            </li>
            <li>
                <a href="/weather/27">
                    🌤️ 大阪府の天気
                </a>
            </li>
            <li>
                <a href="/weather/1">
                    🌤️ 北海道の天気
                </a>
            </li>
        </ul>
    </div>

    <!-- アクション -->
    <div class="actions">
        <a href="/" class="btn btn-primary">トップページに戻る</a>
        <button onclick="history.back()" class="btn btn-secondary">前のページに戻る</button>
    </div>
</div>

<script>
    function searchPrefecture(event) {
        if (event.key === 'Enter') {
            const query = event.target.value.trim();
            if (query) {
                window.location.href = '/?search=' + encodeURIComponent(query);
            }
        }
    }
</script>
</body>
</html>
