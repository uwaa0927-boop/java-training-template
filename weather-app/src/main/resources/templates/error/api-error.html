<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 - サービス利用不可</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .error-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 60px 40px;
        max-width: 600px;
        width: 100%;
        text-align: center;
    }

    .error-icon {
        font-size: 80px;
        margin-bottom: 20px;
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
        }
    }

    .error-code {
        font-size: 100px;
        font-weight: bold;
        color: #f39c12;
        line-height: 1;
        margin-bottom: 20px;
    }

    .error-title {
        font-size: 32px;
        color: #2c3e50;
        margin-bottom: 15px;
    }

    .error-message {
        font-size: 18px;
        color: #7f8c8d;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .status-info {
        background: #fff3cd;
        border: 2px solid #ffc107;
        padding: 20px;
        border-radius: 8px;
        margin: 30px 0;
    }

    .status-info h3 {
        color: #856404;
        margin-bottom: 10px;
    }

    .status-info p {
        color: #856404;
        line-height: 1.6;
    }

    .retry-section {
        margin: 30px 0;
    }

    .countdown {
        font-size: 48px;
        font-weight: bold;
        color: #f39c12;
        margin: 20px 0;
    }

    .actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }

    .btn-primary {
        background: #27ae60;
        color: white;
    }

    .btn-primary:hover {
        background: #229954;
    }

    .btn-secondary {
        background: #ecf0f1;
        color: #2c3e50;
    }

    @media (max-width: 768px) {
        .error-container {
            padding: 40px 20px;
        }

        .error-code {
            font-size: 80px;
        }

        .actions {
            flex-direction: column;
        }

        .btn {
            width: 100%;
        }
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-icon">🌐</div>
  <div class="error-code">503</div>
  <h1 class="error-title">天気情報を取得できません</h1>
  <p class="error-message" th:text="${errorMessage} ?: '外部APIに接続できませんでした'">
    外部APIに接続できませんでした
  </p>

  <div class="status-info">
    <h3>💡 考えられる原因</h3>
    <p>
      • 天気情報提供サービスが一時的に利用できない<br>
      • ネットワーク接続に問題がある<br>
      • サーバーのメンテナンス中
    </p>
  </div>

  <div class="retry-section" th:if="${retryUrl}">
    <p>自動的に再試行します...</p>
    <div class="countdown" id="countdown">10</div>
  </div>

  <div class="actions">
    <a th:href="${retryUrl}" th:if="${retryUrl}" class="btn btn-primary">今すぐ再試行</a>
    <a href="/" class="btn btn-secondary">トップページに戻る</a>
  </div>
</div>

<script th:if="${retryUrl}">
  let countdown = 10;
  const countdownEl = document.getElementById('countdown');
  const retryUrl = /*[[${retryUrl}]]*/ '/';

  const timer = setInterval(() => {
      countdown--;
      if (countdownEl) {
          countdownEl.textContent = countdown;
      }

      if (countdown <= 0) {
          clearInterval(timer);
          window.location.href = retryUrl;
      }
  }, 1000);
</script>
</body>
</html>
