<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>練習ページ</title>

    <link rel="stylesheet" href="/css/favorites.css">
</head>
<body>
<h1 th:text="${message}"></h1>

<h2>アノテーション練習リンク</h2>
<ul>
    <li><a href="/practice/param?name=Taro&age=25">@RequestParam練習</a></li>
    <li><a href="/practice/user/123">@PathVariable練習</a></li>
    <li><a href="/practice/article/tech/456">複数PathVariable練習</a></li>
    <li><a href="/practice/json">JSON返却練習</a></li>
</ul>

<!-- お気に入りセクション -->
<section class="favorites-section" id="favoritesSection" style="display: none;">
    <div class="favorites-header">
        <h2>
            ⭐ お気に入り
            <span class="favorite-badge" id="favoriteBadge">0</span>
        </h2>
        <button class="btn btn-sm" onclick="clearAllFavorites()">
            すべてクリア
        </button>
    </div>

    <div class="favorites-grid" id="favoritesGrid">
        <!-- JavaScriptで動的生成 -->
    </div>

    <div class="favorites-empty" id="favoritesEmpty">
        <div class="favorites-empty-icon">⭐</div>
        <p>お気に入りの都道府県を追加してください</p>
    </div>
</section>

<!-- 都道府県カードにお気に入りボタン追加 -->
<div class="prefecture-card" style="position: relative;">
    <button class="favorite-btn"
            data-prefecture-id="${pref.id}"
            onclick="event.stopPropagation();">
        ☆
    </button>
    <a th:href="@{/weather/{id}(id=${pref.id})}">
        <h3 class="prefecture-name" th:text="${pref.name}">東京都</h3>
    </a>
</div>
</body>
</html>
