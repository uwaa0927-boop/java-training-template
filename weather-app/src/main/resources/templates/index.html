<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('全国天気予報')}">

    <link rel="stylesheet" th:href="@{/css/favorites.css}">

</head>
<body>

<a href="#main-content" class="skip-link">
    メインコンテンツへスキップ
</a>

<!-- ナビゲーション -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- メインコンテンツ -->
<main id="main-content">
    <div class="container">

        <section class="favorites-section" id="favoritesSection" style="display: none;">
            <div class="favorites-header">
                <h2>
                    ⭐ お気に入り
                    <span class="favorite-badge" id="favoriteBadge">0</span>
                </h2>
                <button class="btn btn-sm" onclick="clearAllFavorites()">
                    すべてクリア
                </button>
            </div>

            <div class="favorites-grid" id="favoritesGrid">
                <!-- JavaScriptで動的生成 -->
            </div>

            <div class="favorites-empty" id="favoritesEmpty">
                <div class="favorites-empty-icon">⭐</div>
                <p>お気に入りの都道府県を追加してください</p>
            </div>
        </section>

        <!-- ヘッダーセクション -->
        <header class="page-header">
            <h1>🌤️ 全国天気予報</h1>
            <p class="subtitle">47都道府県の天気情報をチェック</p>
        </header>

        <!-- 検索・フィルタセクション -->
        <div class="search-filter-section">
            <!-- 検索ボックス -->
            <div class="search-box">

                <label for="searchInput" class="visually-hidden">
                    都道府県検索
                </label>

                <input type="text"
                       id="searchInput"
                       placeholder="都道府県名で検索..."
                       onkeyup="filterPrefectures()">
            </div>

            <!-- 地域フィルタ -->
            <div class="region-filter">
                <form method="get" action="/">
                    <label for="regionSelect">地域で絞り込み:</label>
                    <select name="region"
                            id="regionSelect"
                            onchange="this.form.submit()">
                        <option value="">すべての地域</option>
                        <option th:each="r : ${regions}"
                                th:value="${r}"
                                th:text="${r}"
                                th:selected="${r == selectedRegion}">
                        </option>
                    </select>
                </form>
            </div>

            <!-- フィルタリセット -->
            <div class="filter-reset" th:if="${selectedRegion}">
                <a th:href="@{/}" class="btn-reset">
                    フィルタをクリア
                </a>
            </div>
        </div>

        <!-- 地域別グループ表示 -->
        <div class="prefectures-container" th:if="${groupedPrefectures}">
            <div th:each="entry : ${groupedPrefectures}"
                 class="region-group"
                 th:attr="data-region=${entry.key}">

                <!-- 地域名 -->
                <h2 class="region-title" th:text="${entry.key}"></h2>

                <!-- 都道府県カード -->
                <div class="prefecture-grid">
                    <div th:each="pref : ${entry.value}"
                         class="prefecture-card"
                         th:attr="data-name=${pref.name}"
                         style="position: relative;">

                        <button
                                class="favorite-btn"
                                th:attr="data-prefecture-id=${pref.id}"
                                onclick="event.stopPropagation();">
                            ☆
                        </button>

                        <a th:href="@{/weather/{id}(id=${pref.id})}"
                           class="card-link">

                            <!-- 都道府県名 -->
                            <h3 class="prefecture-name" th:text="${pref.name}"></h3>

                            <!-- 英語名 -->
                            <p class="prefecture-name-en" th:text="${pref.nameEn}"></p>

                            <!-- 座標情報（デバッグ用・後で削除可） -->
                            <div class="prefecture-info">
                                    <span class="info-item">
                                        緯度: <span th:text="${#numbers.formatDecimal(pref.latitude, 1, 3)}"></span>
                                    </span>
                                <span class="info-item">
                                        経度: <span th:text="${#numbers.formatDecimal(pref.longitude, 1, 3)}"></span>
                                    </span>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- フィルタ結果表示（地域フィルタ適用時） -->
        <div class="prefectures-container" th:if="${prefectures}">
            <div class="region-group">
                <h2 class="region-title">
                    <span th:text="${selectedRegion}"></span>地方
                    (<span th:text="${#lists.size(prefectures)}"></span>件)
                </h2>

                <div class="prefecture-grid">
                    <div th:each="pref : ${prefectures}"
                         class="prefecture-card"
                         th:attr="data-name=${pref.name}">

                        <a th:href="@{/weather/{id}(id=${pref.id})}"
                           class="card-link">
                            <h3 class="prefecture-name" th:text="${pref.name}"></h3>
                            <p class="prefecture-name-en" th:text="${pref.nameEn}"></p>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- データがない場合 -->
        <div class="no-data"
             th:if="${groupedPrefectures == null and prefectures == null}">
            <p>データが見つかりませんでした。</p>
        </div>
    </div>
</main>



<!-- フッター -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- スクリーンリーダー用通知領域 -->
<div id="aria-announcer"
     class="visually-hidden"
     role="status"
     aria-live="polite"
     aria-atomic="true">
</div>

<!-- JavaScript -->
<script>
    /**
     * 都道府県名でフィルタリング
     */
    function filterPrefectures() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase();
        const cards = document.querySelectorAll('.prefecture-card');

        cards.forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            if (name.includes(filter)) {
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });

        // 地域グループの表示制御
        updateRegionVisibility();
    }

    /**
     * 空の地域グループを非表示
     */
    function updateRegionVisibility() {
        const regionGroups = document.querySelectorAll('.region-group');

        regionGroups.forEach(group => {
            const visibleCards = group.querySelectorAll(
                '.prefecture-card[style*="display: none"]'
            ).length;

            const totalCards = group.querySelectorAll('.prefecture-card').length;

            if (visibleCards === totalCards) {
                group.style.display = 'none';
            } else {
                group.style.display = '';
            }
        });
    }
</script>

<style>
    /* ページヘッダー */
    .page-header {
        text-align: center;
        padding: 40px 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 10px;
        margin-bottom: 30px;
    }

    .page-header h1 {
        font-size: 36px;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 18px;
        opacity: 0.9;
    }

    /* 検索・フィルタセクション */
    .search-filter-section {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
        flex-wrap: wrap;
        align-items: center;
    }

    .search-box {
        flex: 1;
        min-width: 250px;
    }

    .search-box input {
        width: 100%;
        padding: 12px 20px;
        font-size: 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        transition: border-color 0.3s;
    }

    .search-box input:focus {
        outline: none;
        border-color: #667eea;
    }

    .region-filter {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .region-filter select {
        padding: 12px 20px;
        font-size: 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        background: white;
        cursor: pointer;
    }

    .btn-reset {
        padding: 12px 24px;
        background: #e74c3c;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        transition: background 0.3s;
    }

    .btn-reset:hover {
        background: #c0392b;
    }

    /* 地域グループ */
    .region-group {
        margin-bottom: 40px;
    }

    .region-title {
        font-size: 24px;
        color: #2c3e50;
        padding: 10px 20px;
        background: #ecf0f1;
        border-left: 5px solid #3498db;
        margin-bottom: 20px;
        border-radius: 5px;
    }

    /* 都道府県グリッド */
    .prefecture-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
    }

    /* 都道府県カード */
    .prefecture-card {
        background: white;
        border: 2px solid #e1e8ed;
        border-radius: 10px;
        transition: all 0.3s;
        overflow: hidden;
    }

    .prefecture-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        border-color: #3498db;
    }

    .card-link {
        display: block;
        padding: 20px;
        text-decoration: none;
        color: inherit;
    }

    .prefecture-name {
        font-size: 18px;
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 5px;
    }

    .prefecture-name-en {
        font-size: 14px;
        color: #7f8c8d;
        margin-bottom: 10px;
    }

    .prefecture-info {
        font-size: 12px;
        color: #95a5a6;
        display: flex;
        flex-direction: column;
        gap: 3px;
    }

    /* データなし */
    .no-data {
        text-align: center;
        padding: 60px 20px;
        color: #95a5a6;
        font-size: 18px;
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
        .page-header h1 {
            font-size: 28px;
        }

        .prefecture-grid {
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .search-filter-section {
            flex-direction: column;
        }

        .search-box {
            width: 100%;
        }
    }

    /*カードホバーエフェクト*/
    .prefecture-card {
        position: relative;
        background: white;
        border: 2px solid #e1e8ed;
        border-radius: 10px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
    }

    .prefecture-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        opacity: 0;
        transition: opacity 0.3s;
        z-index: -1;
    }

    .prefecture-card:hover::before {
        opacity: 0.1;
    }

    .prefecture-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(102, 126, 234, 0.3);
        border-color: #667eea;
    }
</style>

<script th:src="@{/js/loading.js}"></script>

</body>
</html>
